<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг судов (AIS)</title>

    <!-- Leaflet CSS для отображения карты -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            height: 100%;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }
        #controls {
            padding: 12px 20px;
            background-color: #1f2937;
            color: #ffffff;
            display: flex;
            gap: 10px;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
        }
        input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #374151;
            background-color: #374151;
            color: #fff;
            font-size: 14px;
        }
        button {
            padding: 8px 16px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        #map {
            flex: 1;
            width: 100%;
        }
        #status {
            font-size: 12px;
            color: #9ca3af;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <div id="controls">
        <input type="text" id="vesselInput" placeholder="Введите названия судов через запятую (например: Arklow, Maersk)">
        <button onclick="updateVessels()">Отслеживать</button>
        <span id="status">Ожидание ввода...</span>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Инициализация карты (центр мира, зум 3)
        const map = L.map('map').setView([20, 0], 3);

        // Подключение тайлов карты OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Объект для хранения маркеров судов { mmsi: marker }
        const markers = {};

        // Функция отправки списка отслеживаемых судов на сервер
        async function updateVessels() {
            const input = document.getElementById('vesselInput').value;
            const vessels = input.split(',').map(v => v.trim()).filter(v => v.length > 0);
            const statusEl = document.getElementById('status');

            statusEl.innerText = "Обновление списка...";

            try {
                const res = await fetch('/api/set_vessels', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vessels: vessels })
                });

                if (res.ok) {
                    statusEl.innerText = `Отслеживаются: ${vessels.join(', ') || 'нет'}`;
                } else {
                    statusEl.innerText = "Ошибка при обновлении списка";
                }
            } catch (err) {
                console.error("Ошибка запроса:", err);
                statusEl.innerText = "Ошибка соединения с сервером";
            }
        }

        // Функция получения текущих координат судов с сервера
        async function fetchData() {
            try {
                const res = await fetch('/api/vessels');
                if (!res.ok) return;

                const vessels = await res.json();

                vessels.forEach(ship => {
                    const popupContent = `
                        <b>${ship.name || 'Неизвестно'}</b><br>
                        MMSI: ${ship.mmsi}<br>
                        Скорость: ${ship.speed} узл.<br>
                        Курс: ${ship.course}°<br>
                        Статус: ${ship.status}<br>
                        Назначение: ${ship.destination}
                    `;

                    if (markers[ship.mmsi]) {
                        // Обновляем позицию существующего маркера
                        markers[ship.mmsi].setLatLng([ship.lat, ship.lon]);
                        markers[ship.mmsi].getPopup().setContent(popupContent);
                    } else {
                        // Создаем новый маркер
                        markers[ship.mmsi] = L.marker([ship.lat, ship.lon])
                            .addTo(map)
                            .bindPopup(popupContent);
                    }
                });
            } catch (err) {
                console.error("Ошибка получения данных судов:", err);
            }
        }

        // Запрашивать обновления с сервера каждые 5 секунд
        setInterval(fetchData, 5000);
        fetchData();
    </script>
</body>
</html>
