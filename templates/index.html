<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIS Vessel Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121826; color: #fff; }
        .control-panel { padding: 12px; background: #1e293b; display: flex; flex-direction: column; gap: 8px; }
        .input-group { display: flex; gap: 8px; }
        input, select, button { padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; }
        input { flex: 1; }
        button { background: #2563eb; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #1d4ed8; }
        #status { font-size: 12px; color: #94a3b8; }
        #map { width: 100vw; height: calc(100vh - 110px); }
    </style>
</head>
<body>

<div class="control-panel">
    <div class="input-group">
        <input type="text" id="vesselInput" placeholder="MMSI или название судна (например, 250005913 или Arklow Ace)">
        <button onclick="startTracking()">Отслеживать</button>
    </div>
    <div class="input-group">
        <select id="regionSelect">
            <option value="europe">Европа</option>
            <option value="world">Весь мир</option>
        </select>
        <span id="status">Статус: Готов</span>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([50.0, 10.0], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let markers = {};

    async function startTracking() {
        const inputVal = document.getElementById('vesselInput').value.trim();
        const regionVal = document.getElementById('regionSelect').value;
        const statusEl = document.getElementById('status');

        statusEl.innerText = "Поиск...";

        const vesselsArray = inputVal ? inputVal.split(',').map(v => v.trim()) : [];

        try {
            const response = await fetch('/api/set_vessels', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ vessels: vesselsArray, region: regionVal })
            });

            const data = await response.json();
            statusEl.innerText = `Отслеживается: ${data.tracking.join(', ') || 'Все суда'}`;
            
            if (data.vessels) {
                renderVessels(data.vessels, true);
            }
        } catch (err) {
            statusEl.innerText = "Ошибка запроса";
        }
    }

    function renderVessels(vessels, shouldCenter = false) {
        vessels.forEach(v => {
            if (v.lat && v.lon) {
                const latLng = [v.lat, v.lon];
                const popupContent = `
                    <b>${v.name}</b><br>
                    MMSI: ${v.mmsi}<br>
                    Скорость: ${v.speed} kn<br>
                    Курс: ${v.course}°<br>
                    Назначение: ${v.destination}
                `;

                if (markers[v.mmsi]) {
                    markers[v.mmsi].setLatLng(latLng).setPopupContent(popupContent);
                } else {
                    markers[v.mmsi] = L.marker(latLng).addTo(map).bindPopup(popupContent);
                }

                if (shouldCenter) {
                    map.setView(latLng, 9);
                }
            }
        });
    }

    // Автоматическое фоновое обновление маркеров каждые 3 секунды
    setInterval(async () => {
        try {
            const res = await fetch('/api/vessels');
            const data = await res.json();
            renderVessels(data, false);
        } catch (e) {}
    }, 3000);
</script>

</body>
</html>
